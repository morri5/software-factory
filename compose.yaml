# Self-hosted Langfuse v4 for the factory's traces (`make langfuse-up`, `make langfuse-down`).
# Adapted from the official docker-compose.yml (github.com/langfuse/langfuse, main, 2026-11-20):
# optional settings left at their defaults, telemetry off, and only the web UI (127.0.0.1:3100)
# and the AI gateway (127.0.0.1:3031) published, so nothing clashes with other local services.
# The secrets written here are lab-only: everything listens on localhost. The real ones
# (LANGFUSE_ENCRYPTION_KEY and the gateway keys) come from the gitignored .env.
# Web, worker and gateway must run the same release (4.75.0 or newer for the gateway).
name: factory-langfuse

services:
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:${LANGFUSE_IMAGE_TAG:-4.86.0}
    restart: always
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment: &langfuse-worker-env
      NEXTAUTH_URL: http://localhost:3100
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      SALT: factory-lab-salt
      # Encrypts the provider keys of the gateway's connections; changing it makes them unreadable.
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in .env (openssl rand -hex 32)}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_USE_AZURE_BLOB: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: myredissecret
      REDIS_TLS_ENABLED: "false"

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:${LANGFUSE_IMAGE_TAG:-4.86.0}
    restart: always
    depends_on: *langfuse-depends-on
    ports:
      - 127.0.0.1:3100:3000
    environment:
      <<: *langfuse-worker-env
      NEXTAUTH_SECRET: factory-lab-secret
      # Headless init: the org, project, API keys and login exist from the first start.
      # Values unquoted: quotes would become part of them.
      LANGFUSE_INIT_ORG_ID: factory
      LANGFUSE_INIT_ORG_NAME: factory
      LANGFUSE_INIT_PROJECT_ID: factory
      LANGFUSE_INIT_PROJECT_NAME: factory
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-factory
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-factory
      LANGFUSE_INIT_USER_EMAIL: admin@factory.local
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: factory-lab-password
      # AI gateway: on once both keys are set (see .env.example).
      LANGFUSE_AI_GATEWAY_SERVICE_KEY: ${LANGFUSE_AI_GATEWAY_SERVICE_KEY:-}
      LANGFUSE_AI_GATEWAY_JWT_PRIVATE_KEY: ${LANGFUSE_AI_GATEWAY_JWT_PRIVATE_KEY:-}
      LANGFUSE_AI_GATEWAY_PUBLIC_URL: http://localhost:3031
    healthcheck:
      # The server listens on the container's hostname only, and the image has no `hostname`.
      test: ["CMD", "node", "-e", "fetch('http://' + require('os').hostname() + ':3000/api/public/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  langfuse-ai-gateway:
    image: docker.langfuse.com/langfuse/ai-gateway:${LANGFUSE_IMAGE_TAG:-4.86.0}
    restart: always
    depends_on:
      - langfuse-web
    ports:
      # The sandbox VMs reach it as host.microsandbox.internal:3031.
      - 127.0.0.1:3031:3031
    environment:
      # Plain HTTP only on the private Docker network; web's answers carry provider keys.
      LANGFUSE_AI_GATEWAY_WEB_URL: ${LANGFUSE_AI_GATEWAY_SERVICE_KEY:+http://langfuse-web:3000}
      LANGFUSE_AI_GATEWAY_ALLOW_HTTP_WEB_URL: "true"
      LANGFUSE_AI_GATEWAY_LISTEN_ADDRESS: 0.0.0.0:3031
      # Without the key the gateway starts unconfigured: /ready and inference return 503.
      LANGFUSE_AI_GATEWAY_SERVICE_KEY: ${LANGFUSE_AI_GATEWAY_SERVICE_KEY:-}
      LANGFUSE_AI_GATEWAY_ALLOW_MISSING_SERVICE_KEY: "true"
      LANGFUSE_AI_GATEWAY_CONNECTION_DRAIN_TIMEOUT_SECONDS: "30"
      LANGFUSE_AI_GATEWAY_TELEMETRY_SHUTDOWN_TIMEOUT_SECONDS: "20"
      # Counts the spend of keys with a budget; without it, such keys get 503.
      LANGFUSE_AI_GATEWAY_REDIS_URL: redis://redis:6379
      LANGFUSE_AI_GATEWAY_REDIS_AUTH: myredissecret
    stop_grace_period: 60s  # above the drain plus the telemetry flush
    healthcheck:
      # Liveness, not /ready: a gateway without keys is unconfigured by design.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3031/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.3.62.3
    restart: always
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  minio:
    image: cgr.dev/chainguard/minio
    restart: always
    entrypoint: sh
    # create the 'langfuse' bucket before starting the service
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  redis:
    image: docker.io/redis:7
    restart: always
    command: >
      --requirepass myredissecret
      --maxmemory-policy noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "myredissecret", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  postgres:
    image: docker.io/postgres:17
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
